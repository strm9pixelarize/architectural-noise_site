# 同一IPからの同時接続数を制限するメモリゾーンの定義（serverブロックの外側）
limit_conn_zone $binary_remote_addr zone=sse_limit:10m;

server {
    # Dockerネットワークからのプロキシヘッダーを信用する設定
    set_real_ip_from 172.16.0.0/12;  # Dockerのサブネット範囲
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    listen 80;
    server_name localhost;
    
    ssi on;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        
        # ページアクセス時に毎回異なるランダムCookie（$request_id）を付与
        add_header Set-Cookie "telemetry_auth=$request_id; Path=/; SameSite=Strict; HttpOnly";
        
        # 存在しないURLに直アクセスされた際も index.html を返す設定（SPAルーティング用）
        try_files $uri $uri/ /index.html;
    }

    # HomepageのウィジェットAPIへプロキシ
    location /homepage-api/ {
        proxy_pass http://172.17.0.1:1040/api/;
        proxy_set_header Host status.neruru.local;
        proxy_set_header X-Forwarded-Host status.neruru.local;
        proxy_set_header X-Real-IP $remote_addr;
    }
    
    # ★ config*.json への直接URLアクセスを拒否（SSI内部からの呼び出しのみ許可）
    location ~* ^/config.*\.json$ {
        root /usr/share/nginx/html;
        internal;
        try_files $uri = 404;
    }

    # キャッシュの設定（アニメーション資材等の読み込み最適化）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        root /usr/share/nginx/html;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # ★ 隠蔽・防護されたバックグラウンドSSEプロキシ
    # パスを推測しにくい名称に変更
    location /api/stream/sys-telemetry {
        # 1. 有効なCookieを持っていないアクセスは 404 で存在を隠蔽
        # if ($cookie_telemetry_auth = "") {
        #    return 404;
        # }

        # 2. 同一サイト（same-origin）以外からのFetch/EventSource呼び出しは 404 で拒否
        if ($http_sec_fetch_site != "same-origin") {
            return 404;
        }

        # 3. 同一IPからのSSE同時接続数を最大 2 件に制限（DoS/コネクション枯渇対策）
        limit_conn sse_limit 5;

        # バックグラウンドSSEサーバーへの転送
        proxy_pass http://telemetry_backend:8080/events;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Python側検証用のシークレットヘッダーを内部付与
        proxy_set_header X-Internal-Secret "LAB_SECRET_KEY_2026";
    }
}