# テキスト系コンテンツの圧縮
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 6;
gzip_types text/plain text/css application/javascript application/json
           image/svg+xml application/xml text/xml;

server {
    # Dockerネットワークからのプロキシヘッダーを信用する設定
    set_real_ip_from 172.16.0.0/12;  # Dockerのサブネット範囲
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    listen 80;
    server_name localhost;
    
    ssi on;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        
        # ページアクセス時に毎回異なるランダムCookie（$request_id）を付与
        add_header Set-Cookie "telemetry_auth=$request_id; Path=/; SameSite=Strict; HttpOnly";
        
        # 存在しないURLに直アクセスされた際も index.html を返す設定（SPAルーティング用）
        try_files $uri $uri/ /index.html;
    }

    # テレメトリ収集係が書き出す JSON: 常に最新を読むためキャッシュ無効
    # 直接アクセス (アドレスバー・素の curl 等) は 404 で隠す。
    # 判定は Sec-Fetch-Site と Referer のどちらか一方でもサイト内読み取りらしく見えれば通す
    # (Sec-Fetch-Site は Cloudflare 経由で化けることがあるため Referer を本命にする)
    location = /telemetry.json {
        set $telemetry_block 1;
        if ($http_sec_fetch_site = "same-origin") { set $telemetry_block 0; }
        if ($http_referer ~ "^https://architectural-n\.net/") { set $telemetry_block 0; }
        if ($telemetry_block) { return 404; }
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store";
    }

    # ★ config*.json への直接URLアクセスを拒否（SSI内部からの呼び出しのみ許可）
    location ~* ^/config.*\.json$ {
        root /usr/share/nginx/html;
        internal;
        try_files $uri = 404;
    }

    # Python スクリプトの直接ダウンロードを遮断
    location ~* \.py$ {
        return 404;
    }

    location ^~ /serverInfo/ {
        root /usr/share/nginx/html;
        internal;
    }

    # キャッシュの設定（アニメーション資材等の読み込み最適化）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        root /usr/share/nginx/html;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

}