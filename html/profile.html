<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile // #Architectural*Noise</title>
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;700&family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/style.css?v=20261125-5">
    
    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="css/tailwind.css">
<link rel="icon" href="/favicon.ico" data-favicon-blue="/favicon-blue.ico" class="site-favicon">
</head>
<body class="bg-[#f7f4eb] text-slate-800 min-h-screen pb-28 font-sans antialiased selection:bg-[#fca73f] selection:text-white">
    <!-- 音声再生用 -->
    <audio id="radio-audio" preload="none"></audio>

    <!-- 画面下部中央に浮遊するコンパクトプレイヤーバー -->
    <div id="radio-player-bar" class="fixed bottom-4 left-1/2 -translate-x-1/2 w-[calc(100%-2rem)] max-w-2xl h-20 bg-[#fca73f]/90 backdrop-blur-md border border-[#fca73f]/50 text-slate-900 z-50 px-4 flex items-center justify-between rounded-2xl shadow-2xl">
        
        <!-- 左側：曲情報 & アートワーク -->
        <div class="flex items-center gap-2.5 min-w-0 max-w-[45%]">
            <img id="radio-art" src="/heroImage/tokyo_station.webp" alt="Artwork" loading="lazy" decoding="async" class="w-8 h-8 rounded-lg object-cover border border-slate-900/20 shadow-sm flex-shrink-0">
            <div class="min-w-0">
                <div id="radio-title" class="text-xs font-bold text-slate-900 font-mono truncate">ON AIR // Loading...</div>
                <div id="radio-artist" class="text-[10px] text-slate-800/80 font-mono truncate">ねるるラジオ</div>
            </div>
        </div>

        <!-- 中央：再生/停止 & LIVEステータス -->
        <div class="flex items-center gap-3">
            <button id="radio-play-btn" onclick="toggleRadioPlay()" class="w-8 h-8 rounded-full bg-slate-900 hover:bg-slate-800 text-[#fca73f] flex items-center justify-center transition shadow-md group flex-shrink-0" aria-label="Play Radio">
                <span id="radio-play-icon" class="flex items-center justify-center"></span>
            </button>
            <div class="hidden sm:flex items-center gap-1.5 bg-[#f7f4eb]/80 px-2 py-0.5 rounded-md border border-slate-900/10">
                <span id="radio-live-dot" class="w-1.5 h-1.5 rounded-full bg-red-500 animate-ping"></span>
                <span id="radio-live-text" class="text-[9px] font-mono text-slate-900 font-bold tracking-wider uppercase">LIVE</span>
            </div>
        </div>

        <!-- 右側：音量コントロール -->
        <div class="flex items-center justify-end gap-2">
            <span id="radio-volume-icon" class="flex items-center justify-center flex-shrink-0"></span>
            <input id="radio-volume" type="range" min="0" max="1" step="0.01" value="0.8" oninput="changeRadioVolume(this.value)" class="w-16 h-1 bg-[#f7f4eb] rounded-lg appearance-none cursor-pointer accent-slate-900">
        </div>
    </div>

    <!-- Header Navigation -->
    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur-md sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
            <a href="/" class="flex items-center gap-2 font-mono font-bold text-[#fca73f] hover:text-[#e09230] transition">
                <i class="fa-solid fa-user-gear"></i>
                <span>PROFILE // WORKBENCH</span>
            </a>
            <a href="/" class="text-xs font-mono text-slate-400 hover:text-[#fca73f] transition flex items-center gap-1.5">
                <i class="fa-solid fa-house"></i> MAIN SITE
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-4 py-12 space-y-10">

        <!-- Hero Card -->
        <div class="bg-slate-900/90 border border-slate-800 rounded-3xl p-6 md:p-10 backdrop-blur-md space-y-6">
            <div class="flex flex-col md:flex-row items-center md:items-start gap-8">
                <img id="detail-avatar" src="./heroImage/myroom.webp" alt="Avatar" class="w-32 h-32 rounded-2xl object-cover border-2 border-[#fca73f]/60 shadow-2xl">
                <div class="space-y-3 text-center md:text-left flex-grow">
                    <div class="flex flex-col md:flex-row md:items-center justify-between gap-2">
                        <div>
                            <h1 id="detail-name" class="text-3xl font-bold font-mono text-white">NOJI</h1>
                            <p id="detail-handle" class="text-l font-mono text-[#fca73f]">@neruru</p>
                        </div>
                        <span id="detail-status" class="inline-block px-3 py-1 rounded-full bg-[#fca73f]/10 border border-[#fca73f]/30 text-[#fca73f] text-xs font-mono">ONLINE // ACTIVE</span>
                    </div>
                    <p id="detail-title" class="text-sm font-mono text-slate-300">Systems Architect / Custom OS / Mechanic & Audio DSP</p>
                    <p id="detail-bio" class="text-slate-400 text-sm leading-relaxed font-sans pt-2">
                        <!-- JSで挿入 -->
                    </p>
                </div>
            </div>
        </div>

        <!-- Social Links Section -->
        <div class="space-y-6">
            <h2 class="text-xl font-bold font-mono text-slate-900 flex items-center gap-2 border-b border-slate-300 pb-3">
                <i class="fa-solid fa-share-nodes text-[#fca73f]"></i>
                <span>SOCIAL LINKS</span>
            </h2>

            <div id="detail-socials" class="flex flex-wrap gap-3">
                <!-- JSで動的挿入 -->
            </div>
        </div>

        <!-- Skills Matrix Section -->
        <div class="space-y-6">
            <h2 class="text-xl font-bold font-mono text-slate-900 flex items-center gap-2 border-b border-slate-300 pb-3">
                <i class="fa-solid fa-layer-group text-[#fca73f]"></i>
                <span>SKILLS & TECHNOLOGIES</span>
            </h2>

            <div id="detail-skills-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- JSで動的挿入 -->
            </div>
        </div>

        <!-- Timeline Section (ねるる年表) -->
        <div class="space-y-6">
            <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-4 border-b border-slate-300 pb-3">
                <h2 class="text-xl font-bold font-mono text-slate-900 flex items-center gap-2">
                    <svg class="w-5 h-5 fill-[#fca73f] flex-shrink-0" viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
                    <span>NERURU CHRONICLE // ねるる年表</span>
                </h2>
            </div>

            <!-- カテゴリー絞り込みボタン（JSで自動生成） -->
            <div id="timeline-filters" class="flex flex-wrap gap-2"></div>

            <!-- 年表本体 -->
            <div id="detail-timeline" class="relative border-l-2 border-slate-300 ml-3 sm:ml-4 pl-6 sm:pl-8 space-y-6">
                <!-- JSで動的挿入 -->
            </div>
        </div>

    </main>

    <!-- Nginx SSI Include -->
    <script type="application/json" id="data-profile"><!--# include file="config/config_profile.json" --></script>

    <script src="js/script.js?v=20261124-1"></script>

    <!-- エフェクト用 JS -->
    <script src="js/effects.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            try {
                // SSIで埋め込まれた JSON 要素を取得
                const el = document.getElementById('data-profile');
                if (!el) return;

                const data = JSON.parse(el.textContent.trim());

                if (data.name) document.getElementById('detail-name').innerText = data.name;
                if (data.handle) document.getElementById('detail-handle').innerText = `@${data.handle}`;
                if (data.title) document.getElementById('detail-title').innerText = data.title;
                if (data.bio) document.getElementById('detail-bio').innerText = data.bio;
                if (data.avatar) document.getElementById('detail-avatar').src = data.avatar;

                // SNSリンクの描画（url と username の両対応）
                const socialsContainer = document.getElementById('detail-socials');
                if (socialsContainer && data.socials) {
                    socialsContainer.innerHTML = data.socials.map(s => {
                        // パターンA: URLが指定されている場合（通常の外部リンク）
                        if (s.url) {
                            return `
                                <a href="${s.url}" target="_blank" rel="noopener noreferrer" class="flex items-center gap-2.5 px-4 py-2.5 rounded-xl bg-slate-900/90 hover:bg-[#fca73f] hover:text-slate-950 border border-slate-800 text-xs font-mono text-slate-200 font-bold transition shadow-md group">
                                    <div class="w-4 h-4 flex items-center justify-center flex-shrink-0 text-[#fca73f] group-hover:text-slate-950 transition-colors">
                                        ${renderIcon(s.icon, 'w-4 h-4 fill-current')}
                                    </div>
                                    <span>${s.name}</span>
                                </a>
                            `;
                        }

                        // パターンB: usernameのみ指定されている場合（クリックでIDコピー）
                        if (s.username) {
                            return `
                                <button type="button" onclick="copySocialUsername(this, '${s.username}')" title="クリックしてユーザー名をコピー" class="flex items-center gap-2.5 px-4 py-2.5 rounded-xl bg-slate-900/90 hover:bg-[#fca73f] hover:text-slate-950 border border-slate-800 text-xs font-mono text-slate-200 font-bold transition shadow-md group cursor-pointer">
                                    <div class="w-4 h-4 flex items-center justify-center flex-shrink-0 text-[#fca73f] group-hover:text-slate-950 transition-colors">
                                        ${renderIcon(s.icon, 'w-4 h-4 fill-current')}
                                    </div>
                                    <span>${s.name}</span>
                                    <span class="social-badge px-2 py-0.5 rounded bg-slate-800 group-hover:bg-slate-950/20 text-[#fca73f] group-hover:text-slate-950 text-[10px] transition-colors">
                                        @${s.username}
                                    </span>
                                </button>
                            `;
                        }

                        return '';
                    }).join('');
                }

                // スキルグリッドの描画
                const skillsGrid = document.getElementById('detail-skills-grid');
                if (skillsGrid && data.skills) {
                    skillsGrid.innerHTML = data.skills.map(cat => `
                        <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-6 space-y-3">
                            <h3 class="text-sm font-bold font-mono text-[#fca73f] uppercase tracking-wider">${cat.category}</h3>
                            <div class="flex flex-wrap gap-2">
                                ${cat.items.map(item => `
                                    <span class="px-2.5 py-1 rounded-lg bg-slate-800 text-slate-200 border border-slate-700/50 text-xs font-mono">${item}</span>
                                `).join('')}
                            </div>
                        </div>
                    `).join('');
                }

                // DOMContentLoaded 内のスキルグリッド描画の後に追記
                if (Array.isArray(data.timeline)) {
                    profileTimelineData = data.timeline;
                    renderTimelineFilters();
                    renderTimelineItems();
                }

            } catch (e) {
                console.error('[Profile Detail Parse Error]', e);
            }
        });

        // ユーザー名をクリップボードにコピーしてフィードバックを表示
        function copySocialUsername(btn, username) {
            navigator.clipboard.writeText(username).then(() => {
                const badge = btn.querySelector('.social-badge');
                if (!badge) return;

                const originalText = badge.innerText;
                badge.innerText = 'COPIED!';
                badge.classList.add('bg-emerald-500', 'text-slate-950');

                setTimeout(() => {
                    badge.innerText = originalText;
                    badge.classList.remove('bg-emerald-500', 'text-slate-950');
                }, 2000);
            }).catch(err => {
                console.error('[Clipboard Copy Error]', err);
            });
        }

        let profileTimelineData = [];
        let activeTimelineCategory = 'all';

        // 年表カテゴリーボタンの自動生成
        function renderTimelineFilters() {
            const container = document.getElementById('timeline-filters');
            if (!container) return;

            // timeline 内の category を重複なしで自動抽出
            const uniqueCategories = [...new Set(
                profileTimelineData.map(item => item.category).filter(Boolean)
            )];
            const categories = ['all', ...uniqueCategories];

            container.innerHTML = '';
            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.type = 'button';
                const isActive = cat === activeTimelineCategory;

                btn.className = `px-3.5 py-1.5 rounded-xl text-xs font-mono font-bold transition flex items-center gap-1.5 whitespace-nowrap ${
                    isActive
                        ? 'bg-slate-900 text-[#fca73f] shadow-md'
                        : 'bg-white text-slate-700 border border-slate-300 hover:bg-slate-100'
                }`;
                btn.innerText = cat === 'all' ? 'ALL' : cat;

                btn.onclick = () => {
                    activeTimelineCategory = cat;
                    renderTimelineFilters();
                    renderTimelineItems();
                };
                container.appendChild(btn);
            });
        }

        // 選択中のカテゴリーで絞り込んで年表を描画（urlリンク対応版）
        function renderTimelineItems() {
            const timelineContainer = document.getElementById('detail-timeline');
            if (!timelineContainer) return;

            const filtered = activeTimelineCategory === 'all'
                ? profileTimelineData
                : profileTimelineData.filter(item => item.category === activeTimelineCategory);

            timelineContainer.innerHTML = filtered.map(item => {
                const hasUrl = Boolean(item.url);
                // http(s)で始まる外部URLの場合のみ別タブで開く
                const isExternal = hasUrl && /^https?:\/\//.test(item.url);
                const targetAttr = isExternal ? 'target="_blank" rel="noopener noreferrer"' : '';

                const cardInner = `
                    <div class="flex flex-wrap items-center justify-between gap-2 font-mono">
                        <span class="text-xs font-bold text-[#fca73f] tracking-wider">${item.date}</span>
                        <div class="flex items-center gap-2">
                            ${item.category ? `<span class="px-2 py-0.5 rounded bg-slate-800 text-slate-300 border border-slate-700/60 text-[10px]">${item.category}</span>` : ''}
                            ${hasUrl ? `
                                <span class="text-slate-400 group-hover:text-[#fca73f] group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-all flex items-center justify-center">
                                    ${renderIcon('up-right-inbox', 'w-4 h-4 fill-current')}
                                </span>
                            ` : ''}
                        </div>
                    </div>
                    <h3 class="text-base font-bold text-white font-mono ${hasUrl ? 'group-hover:text-[#fca73f] transition-colors' : ''}">
                        ${item.title}
                    </h3>
                    ${item.description ? `<p class="text-slate-400 text-xs leading-relaxed font-sans">${item.description}</p>` : ''}
                `;

                const cardClass = "block bg-slate-900/90 border border-slate-800 hover:border-[#fca73f]/50 rounded-2xl p-5 backdrop-blur-md shadow-lg transition space-y-2";

                return `
                    <div class="relative group">
                        <!-- タイムライン軸上のドットマーカー -->
                        <span class="absolute -left-[31px] sm:-left-[39px] top-5 w-3.5 h-3.5 rounded-full bg-[#fca73f] border-4 border-[#f7f4eb] shadow group-hover:scale-125 transition-transform"></span>
                        
                        <!-- イベントカード（urlの有無で <a> と <div> を自動切替） -->
                        ${hasUrl
                            ? `<a href="${item.url}" ${targetAttr} class="${cardClass} cursor-pointer">${cardInner}</a>`
                            : `<div class="${cardClass}">${cardInner}</div>`
                        }
                    </div>
                `;
            }).join('');
        }
    </script>
</body>
</html>
