<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partners & Collaborators // ARCHITECTURAL NOISE</title>
    
    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;700&family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/style.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        brand: '#fca73f',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-[#f7f4eb] text-slate-800 min-h-screen pb-28 font-sans antialiased selection:bg-[#fca73f] selection:text-white">
    <!-- 音声再生用 -->
    <audio id="radio-audio" preload="none"></audio>

    <!-- 画面下部中央に浮遊するコンパクトプレイヤーバー -->
    <div id="radio-player-bar" class="fixed bottom-4 left-1/2 -translate-x-1/2 w-[calc(100%-2rem)] max-w-2xl h-20 bg-[#fca73f]/90 backdrop-blur-md border border-[#fca73f]/50 text-slate-900 z-50 px-4 flex items-center justify-between rounded-2xl shadow-2xl">
        <div class="flex items-center gap-2.5 min-w-0 max-w-[45%]">
            <img id="radio-art" src="/heroImage/tokyo_station.jpg" alt="Artwork" class="w-8 h-8 rounded-lg object-cover border border-slate-900/20 shadow-sm flex-shrink-0">
            <div class="min-w-0">
                <div id="radio-title" class="text-xs font-bold text-slate-900 font-mono truncate">ON AIR // Loading...</div>
                <div id="radio-artist" class="text-[10px] text-slate-800/80 font-mono truncate">ねるるラジオ</div>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <button id="radio-play-btn" onclick="toggleRadioPlay()" class="w-8 h-8 rounded-full bg-slate-900 hover:bg-slate-800 text-[#fca73f] flex items-center justify-center transition shadow-md group flex-shrink-0">
                <i id="radio-play-icon" class="fa-solid fa-play text-[10px] group-hover:scale-110 transition-transform ml-0.5"></i>
            </button>
            <div class="hidden sm:flex items-center gap-1.5 bg-[#f7f4eb]/80 px-2 py-0.5 rounded-md border border-slate-900/10">
                <span id="radio-live-dot" class="w-1.5 h-1.5 rounded-full bg-red-500 animate-ping"></span>
                <span id="radio-live-text" class="text-[9px] font-mono text-slate-900 font-bold tracking-wider uppercase">LIVE</span>
            </div>
        </div>
        <div class="flex items-center justify-end gap-2">
            <i class="fa-solid fa-volume-high text-slate-900 text-[10px]"></i>
            <input id="radio-volume" type="range" min="0" max="1" step="0.01" value="0.8" oninput="changeRadioVolume(this.value)" class="w-16 h-1 bg-[#f7f4eb] rounded-lg appearance-none cursor-pointer accent-slate-900">
        </div>
    </div>

    <!-- Header Navigation -->
    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur-md sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
            <a href="/partner.html" class="flex items-center gap-2 font-mono font-bold text-[#fca73f] hover:text-[#e09230] transition">
                <i class="fa-solid fa-handshake"></i>
                <span>PARTNERS // WORKBENCH</span>
            </a>
            <a href="/" class="text-xs font-mono text-slate-400 hover:text-[#fca73f] transition flex items-center gap-1.5">
                <i class="fa-solid fa-house"></i> MAIN SITE
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-5xl mx-auto px-4 py-12 space-y-10">

        <!-- Header Title Section -->
        <div class="space-y-3 border-b border-slate-300 pb-6">
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-[#fca73f]/10 border border-[#fca73f]/30 text-[#fca73f] text-xs font-mono font-bold">
                <i class="fa-solid fa-users"></i>
                <span>COLLABORATORS & CONTRIBUTORS</span>
            </div>
            <h1 class="text-3xl font-bold font-mono text-slate-900">Partners & Collaborators</h1>
            <p id="partner-section-desc" class="text-sm font-mono text-slate-600">
                ワークベンチのインフラ構築、UI/UX検証、メディア・コンテンツ制作で日常的に協働・サポートしてくれているメンバー
            </p>
        </div>

        <!-- Partners Grid (JSで動的描画) -->
        <div id="partner-cards-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- JSで動的にカードが挿入されます -->
        </div>

    </main>

    <!-- Nginx SSI Include -->
    <script type="application/json" id="data-partners"><!--# include file="config_partners.json" --></script>

    <script src="js/script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            try {
                const el = document.getElementById('data-partners');
                if (!el) return;

                const data = JSON.parse(el.textContent.trim());

                if (data.description) {
                    const descEl = document.getElementById('partner-section-desc');
                    if (descEl) descEl.innerText = data.description;
                }

                const grid = document.getElementById('partner-cards-grid');
                if (grid && data.partners) {
                    grid.innerHTML = data.partners.map(p => `
                        <div class="bg-slate-900/90 border border-slate-800 rounded-3xl p-6 md:p-8 backdrop-blur-md flex flex-col justify-between space-y-6 shadow-xl hover:border-[#fca73f]/50 transition group">
                            <div class="space-y-4">
                                <!-- ヘッダー部分（アバター + 名前 + ロール） -->
                                <div class="flex items-start gap-4">
                                    <img src="${p.avatar || './heroImage/profile.jpg'}" alt="${p.name}" class="w-16 h-16 sm:w-20 sm:h-20 rounded-2xl object-cover border-2 border-[#fca73f]/60 shadow-lg flex-shrink-0 group-hover:scale-105 transition-transform duration-300">
                                    <div class="space-y-1 min-w-0 flex-grow">
                                        <div class="flex items-center justify-between gap-2">
                                            <h2 class="text-xl font-bold font-mono text-white truncate">${p.name}</h2>
                                            <span class="px-2 py-0.5 rounded-full bg-[#fca73f]/20 border border-[#fca73f]/40 text-[#fca73f] text-[9px] font-mono font-bold uppercase flex-shrink-0">
                                                ${p.status || 'COLLABORATOR'}
                                            </span>
                                        </div>
                                        <p class="text-xs font-mono text-[#fca73f] font-semibold">${p.role}</p>
                                    </div>
                                </div>

                                <!-- 説明文 -->
                                <p class="text-slate-300 text-sm leading-relaxed font-sans border-t border-slate-800/80 pt-3">
                                    ${p.bio}
                                </p>
                            </div>

                            <!-- フッター部分（タグ + SNSボタン） -->
                            <div class="space-y-4 pt-2">
                                <!-- タグ一覧 -->
                                <div class="flex flex-wrap gap-1.5">
                                    ${(p.tags || []).map(t => `
                                        <span class="px-2.5 py-0.5 rounded-lg bg-[#fca73f]/10 text-[#fca73f] border border-[#fca73f]/30 text-[10px] font-mono">#${t}</span>
                                    `).join('')}
                                </div>

                                <!-- SNSリンクボタン -->
                                <div class="flex flex-wrap gap-2 border-t border-slate-800/80 pt-3">
                                    ${(p.socials || []).map(s => `
                                        <a href="${s.url}" target="_blank" class="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-[#fca73f] hover:text-slate-950 border border-slate-700/60 text-xs font-mono text-slate-200 font-bold transition flex items-center gap-1.5">
                                            <i class="${s.icon}"></i>
                                            <span>${s.name}</span>
                                        </a>
                                    `).join('')}
                                </div>
                            </div>
                        </div>
                    `).join('');
                }

            } catch (e) {
                console.error('[Partner Detail Parse Error]', e);
            }
        });
    </script>
</body>
</html>
